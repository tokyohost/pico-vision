name: 构建 macOS 双架构应用

on:
  push:
    branches: ["mac_os_support"]
    tags: ["v*"]
    paths:
      - "monitor/**"
      - ".github/workflows/build-macos-dmg.yml"
  workflow_dispatch:
    inputs:
      sign_and_notarize:
        description: 使用 Developer ID 签名并公证（需要配置 Secrets）
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: pico-monitor-macos-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: macOS ${{ matrix.architecture }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            architecture: x86_64
            python_architecture: x64
          - runner: macos-15
            architecture: arm64
            python_architecture: arm64
    defaults:
      run:
        shell: bash
        working-directory: monitor
    env:
      PYTHONUTF8: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      MACOSX_DEPLOYMENT_TARGET: "12.0"
      SIGN_RELEASE: ${{ startsWith(github.ref, 'refs/tags/v') || inputs.sign_and_notarize == true }}
      MONITOR_MAC_NOTARY_PROFILE: omniwatch-notary
      MONITOR_MAC_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
    steps:
      - name: 检出代码
        uses: actions/checkout@v6

      - name: 初始化构建临时路径
        run: |
          set -euo pipefail
          # job 级 env 不允许 runner 上下文；在分配 runner 后写入步骤环境。
          printf 'UV_PYTHON_INSTALL_DIR=%s/omniwatch-python\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
          printf 'MONITOR_MAC_NOTARY_KEYCHAIN=%s/omniwatch-signing.keychain-db\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"

      - name: 安装原生 Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13.5"
          architecture: ${{ matrix.python_architecture }}

      - name: 安装 Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: 构建 Intel 静态 OpenSSL
        if: matrix.architecture == 'x86_64'
        run: |
          set -euo pipefail
          # cryptography 49 起不再提供 Intel macOS wheel；从源码构建时不链接
          # runner 的 Homebrew 动态库，保留新版安全修复与 macOS 12 部署目标。
          source_root="$RUNNER_TEMP/omniwatch-openssl-source"
          openssl_root="$RUNNER_TEMP/omniwatch-openssl"
          mkdir -p "$source_root"
          archive="$source_root/openssl-4.0.3.tar.gz"
          curl --fail --location --retry 3 --output "$archive" https://github.com/openssl/openssl/releases/download/openssl-4.0.3/openssl-4.0.3.tar.gz
          # 摘要固定为 OpenSSL 官方发布制品，下载或校验失败必须终止。
          printf '325b5c806167c13b40b1ffeadfe0248197c00eccc4cf123ec1e28d2d2fd216d9  %s\n' "$archive" | shasum -a 256 -c -
          tar -xzf "$archive" -C "$source_root"
          (
            cd "$source_root/openssl-4.0.3"
            ./Configure darwin64-x86_64-cc no-shared no-tests --prefix="$openssl_root" --libdir=lib -mmacosx-version-min=12.0
            make -j"$(sysctl -n hw.ncpu)"
            make install_sw
          )
          printf 'OPENSSL_DIR=%s\n' "$openssl_root" >> "$GITHUB_ENV"
          printf 'OPENSSL_STATIC=1\n' >> "$GITHUB_ENV"

      - name: 安装依赖与独立插件运行时
        run: |
          set -euo pipefail
          python -m pip install "uv==0.8.22"
          uv python install 3.13.5
          runtime_python="$(uv python find --managed-python 3.13.5)"
          runtime_root="$("$runtime_python" -I -c 'import sys; print(sys.prefix)')"
          # setup-python 的解释器可能链接 runner 上仅兼容新系统的 Homebrew OpenSSL。
          # 冻结构建与插件使用同一可迁移 Python，最低系统仍由原生依赖审计强制检查。
          build_environment="$RUNNER_TEMP/omniwatch-build-venv"
          uv venv --seed --python "$runtime_python" "$build_environment"
          dependency_options=(--only-binary cryptography)
          if [[ "${{ matrix.architecture }}" == x86_64 ]]; then
            dependency_options=(--no-binary cryptography)
          fi
          uv pip install --python "$build_environment/bin/python" "${dependency_options[@]}" -r desktop/macos/requirements.txt
          printf 'MONITOR_PLUGIN_RUNTIME=%s\n' "$runtime_root" >> "$GITHUB_ENV"
          printf 'MONITOR_BUILD_PYTHON=%s/bin/python\n' "$build_environment" >> "$GITHUB_ENV"

      - name: 构建共享 Vue 界面
        run: |
          npm ci --prefix win/ui-web
          npm run build --prefix win/ui-web

      - name: 写入标签版本
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          "$MONITOR_BUILD_PYTHON" - <<'PY'
          import os, re
          from pathlib import Path
          version = os.environ["GITHUB_REF_NAME"][1:]
          if not re.fullmatch(r"\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?(?:\+[0-9A-Za-z.-]+)?", version):
              raise SystemExit("发布标签必须是 v 开头的语义化版本")
          Path("build_info.py").write_text(
              '"""保存 CI 写入的发布版本与更新仓库。"""\n'
              + 'MONITOR_VERSION = ' + repr(version) + '\n'
              + 'GITHUB_REPOSITORY = "tokyohost/omniwatch-doc"\n', encoding="utf-8")
          PY

      - name: 隔离执行全部适用回归测试
        run: |
          set -euo pipefail
          # 固件与桌面含同名模块，每个测试文件必须在独立进程运行。
          # Windows 原生注册表测试在 Windows 回归执行，不在 Mac 伪造系统 API。
          "$MONITOR_BUILD_PYTHON" -B tools/run_isolated_tests.py --report dist/macos-test-results.json

      - name: 导入证书与公证凭据
        if: env.SIGN_RELEASE == 'true'
        env:
          CERTIFICATE_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.MACOS_APPLE_ID }}
          APP_PASSWORD: ${{ secrets.MACOS_APP_PASSWORD }}
          TEAM_ID: ${{ secrets.MACOS_TEAM_ID }}
        run: |
          set -euo pipefail
          # 标签发布缺少凭据时直接失败，不降级成未公证包。
          for value in CERTIFICATE_BASE64 CERTIFICATE_PASSWORD MONITOR_MAC_SIGNING_IDENTITY APPLE_ID APP_PASSWORD TEAM_ID; do
            if [[ -z "${!value}" ]]; then echo "缺少 Secret：$value"; exit 1; fi
          done
          certificate="$RUNNER_TEMP/omniwatch-certificate.p12"
          printf '%s' "$CERTIFICATE_BASE64" | /usr/bin/base64 --decode > "$certificate"
          chmod 600 "$certificate"
          keychain_password="$(openssl rand -hex 32)"
          echo "::add-mask::$keychain_password"
          security create-keychain -p "$keychain_password" "$MONITOR_MAC_NOTARY_KEYCHAIN"
          security set-keychain-settings -lut 21600 "$MONITOR_MAC_NOTARY_KEYCHAIN"
          security unlock-keychain -p "$keychain_password" "$MONITOR_MAC_NOTARY_KEYCHAIN"
          security import "$certificate" -P "$CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$MONITOR_MAC_NOTARY_KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$MONITOR_MAC_NOTARY_KEYCHAIN"
          security list-keychains -d user -s "$MONITOR_MAC_NOTARY_KEYCHAIN" "$HOME/Library/Keychains/login.keychain-db"
          xcrun notarytool store-credentials "$MONITOR_MAC_NOTARY_PROFILE" --apple-id "$APPLE_ID" --password "$APP_PASSWORD" --team-id "$TEAM_ID" --keychain "$MONITOR_MAC_NOTARY_KEYCHAIN"
          rm -f "$certificate"

      - name: 构建应用、审计依赖并制作 DMG
        run: |
          set -euo pipefail
          arguments=(--architecture "${{ matrix.architecture }}" --runtime "$MONITOR_PLUGIN_RUNTIME" --output dist/macos)
          if [[ "$SIGN_RELEASE" != true ]]; then arguments+=(--unsigned); fi
          "$MONITOR_BUILD_PYTHON" -B -m desktop.macos.build "${arguments[@]}"

      - name: 上传对应架构 ZIP 与 DMG
        uses: actions/upload-artifact@v7
        with:
          name: macos-${{ matrix.architecture }}
          path: |
            monitor/dist/macos/*.zip
            monitor/dist/macos/*.dmg
          if-no-files-found: error
          compression-level: 0

      - name: 保留回归测试报告
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: tests-macos-${{ matrix.architecture }}
          path: monitor/dist/macos-test-results.json
          if-no-files-found: warn

      - name: 清理临时证书与钥匙串
        if: always() && env.SIGN_RELEASE == 'true'
        run: |
          security delete-keychain "$MONITOR_MAC_NOTARY_KEYCHAIN" || true
          rm -f "$RUNNER_TEMP/omniwatch-certificate.p12"

  release:
    name: 发布正式 macOS 制品
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - name: 检出代码
        uses: actions/checkout@v6
      - name: 下载双架构制品
        uses: actions/download-artifact@v5
        with:
          pattern: macos-*
          path: release-assets
          merge-multiple: true
      - name: 发布本仓库 Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes --title "$GITHUB_REF_NAME" || gh release view "$GITHUB_REF_NAME" >/dev/null
          gh release upload "$GITHUB_REF_NAME" release-assets/*.zip release-assets/*.dmg --clobber
      - name: 同步到现有自动更新仓库
        env:
          GH_TOKEN: ${{ secrets.OMNIWATCH_DOC_TOKEN }}
          GH_REPO: tokyohost/omniwatch-doc
        run: |
          set -euo pipefail
          if [[ -z "$GH_TOKEN" ]]; then echo "缺少 OMNIWATCH_DOC_TOKEN，无法同步自动更新资源"; exit 1; fi
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --target main --title "$GITHUB_REF_NAME" --notes "macOS 双架构签名发行包" || gh release view "$GITHUB_REF_NAME" >/dev/null
          gh release upload "$GITHUB_REF_NAME" release-assets/*.zip release-assets/*.dmg --clobber
