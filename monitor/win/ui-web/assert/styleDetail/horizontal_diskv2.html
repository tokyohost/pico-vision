<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width"><title>九盘紧凑版</title><style>body{margin:0;padding:24px;font:14px/1.65 "Microsoft YaHei",sans-serif;color:#dce5f2;background:#0b1020}h1{margin:0;color:#fff;font-size:25px}h2{margin:24px 0 10px;color:#9eb7ff;font-size:17px}.lead{color:#91a0b8}.tag{display:inline-block;margin:8px 6px 0 0;padding:3px 9px;border-radius:99px;color:#b9caff;background:#17264a}table{width:100%;border-collapse:collapse;background:#111a2d}th,td{padding:10px 12px;border:1px solid #293650;text-align:left;vertical-align:top}th{color:#aebcd1;background:#18243b}.tip{padding:12px 14px;border-left:3px solid #5b8cff;background:#111a2d}</style></head><body><h1>九盘紧凑版</h1><p class="lead">压缩留白与图表尺寸，在横屏上提高九盘数据密度。</p><span class="tag">9 盘</span><span class="tag">高密度</span><h2>适用场景</h2><p>适合需要同时关注多块磁盘、但希望保留 CPU、内存、GPU 与网络状态的 NAS 或存储主机。</p><h2>指标解释</h2><table><tr><th>指标</th><th>解释</th></tr><tr><td>CPU / MEM / GPU</td><td>整机处理器、物理内存和显卡使用率；趋势用于观察持续负载。</td></tr><tr><td>UP / DN / PING</td><td>网络实时上传、下载与往返延迟。</td></tr><tr><td>磁盘占用</td><td>各磁盘已用容量百分比与容量摘要。</td></tr><tr><td>磁盘健康</td><td>H0–H5 综合健康等级，越高越需要关注。</td></tr><tr><td>温度与读写</td><td>磁盘当前温度及读写吞吐，用于判断散热和活动强度。</td></tr></table><p class="tip">紧凑布局会缩短过长的磁盘名称；请结合磁盘顺序和容量识别具体设备。</p></body></html>
