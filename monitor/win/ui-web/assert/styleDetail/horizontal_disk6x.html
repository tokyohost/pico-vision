<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width"><title>六盘均衡版</title><style>body{margin:0;padding:24px;font:14px/1.65 "Microsoft YaHei",sans-serif;color:#dce5f2;background:#0b1020}h1{margin:0;color:#fff;font-size:25px}h2{margin:24px 0 10px;color:#9eb7ff;font-size:17px}.lead{color:#91a0b8}.tag{display:inline-block;margin:8px 6px 0 0;padding:3px 9px;border-radius:99px;color:#b9caff;background:#17264a}table{width:100%;border-collapse:collapse;background:#111a2d}th,td{padding:10px 12px;border:1px solid #293650;text-align:left;vertical-align:top}th{color:#aebcd1;background:#18243b}.tip{padding:12px 14px;border-left:3px solid #f0b35a;background:#111a2d}</style></head><body><h1>六盘均衡版</h1><p class="lead">在四盘大字号与九盘高密度之间取得平衡，展示最多六块磁盘。</p><span class="tag">6 盘</span><span class="tag">均衡布局</span><h2>指标一览</h2><table><tr><th>区域</th><th>指标</th></tr><tr><td>处理器</td><td>CPU 使用率、温度和近期趋势。</td></tr><tr><td>内存与显卡</td><td>内存占用、容量以及 GPU 使用率。</td></tr><tr><td>网络</td><td>上传/下载速率、趋势和 Ping 延迟。</td></tr><tr><td>六盘状态</td><td>每块磁盘的名称、空间占用、H0–H5 健康等级、温度、读取/写入速率与趋势。</td></tr></table><h2>告警理解</h2><p>容量颜色反映空间压力；健康颜色反映介质或 S.M.A.R.T. 风险；温度颜色反映散热状态。三者应分别判断。</p><p class="tip">出现高健康等级时，优先备份而不是反复压力测试，以免增加故障盘负担。</p></body></html>
