<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width"><title>四盘清晰版</title><style>body{margin:0;padding:24px;font:14px/1.65 "Microsoft YaHei",sans-serif;color:#dce5f2;background:#0b1020}h1{margin:0;color:#fff;font-size:25px}h2{margin:24px 0 10px;color:#9eb7ff;font-size:17px}.lead{color:#91a0b8}.tag{display:inline-block;margin:8px 6px 0 0;padding:3px 9px;border-radius:99px;color:#b9caff;background:#17264a}table{width:100%;border-collapse:collapse;background:#111a2d}th,td{padding:10px 12px;border:1px solid #293650;text-align:left;vertical-align:top}th{color:#aebcd1;background:#18243b}.tip{padding:12px 14px;border-left:3px solid #f0b35a;background:#111a2d}</style></head><body><h1>四盘清晰版</h1><p class="lead">以较大字号和图表展示四块主要磁盘，适合远距离观察。</p><span class="tag">4 盘</span><span class="tag">大字号</span><span class="tag">读写趋势</span><h2>显示内容</h2><table><tr><th>指标</th><th>解释</th></tr><tr><td>CPU</td><td>处理器使用率、温度与历史曲线。</td></tr><tr><td>MEM</td><td>内存使用率、已用/总容量。</td></tr><tr><td>NET</td><td>网络上传、下载、Ping 及近期吞吐趋势。</td></tr><tr><td>四盘卡片</td><td>磁盘名称、容量占用、H0–H5 健康等级、温度、读写速率和趋势。</td></tr></table><h2>如何理解健康状态</h2><p>H0 表示当前未发现健康告警，等级越大风险越高；H3 以上会明显警示。该等级与“已用百分比”相互独立：空盘也可能存在健康问题，满盘也不一定损坏。</p><p class="tip">磁盘温度持续偏高时应检查风道、风扇和盘位间距；具体温度阈值以硬盘厂商规格为准。</p></body></html>
