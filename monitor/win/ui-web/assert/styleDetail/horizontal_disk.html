<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width"><title>九盘横屏版</title><style>body{margin:0;padding:24px;font:14px/1.65 "Microsoft YaHei",sans-serif;color:#dce5f2;background:#0b1020}h1{margin:0;color:#fff;font-size:25px}h2{margin:24px 0 10px;color:#9eb7ff;font-size:17px}.lead{color:#91a0b8}.tag{display:inline-block;margin:8px 6px 0 0;padding:3px 9px;border-radius:99px;color:#b9caff;background:#17264a}table{width:100%;border-collapse:collapse;background:#111a2d}th,td{padding:10px 12px;border:1px solid #293650;text-align:left;vertical-align:top}th{color:#aebcd1;background:#18243b}.tip{padding:12px 14px;border-left:3px solid #5b8cff;background:#111a2d}</style></head><body><h1>九盘横屏版</h1><p class="lead">为横屏优化的多盘综合仪表盘，兼顾系统负载与最多九块磁盘。</p><span class="tag">9 盘</span><span class="tag">横屏</span><span class="tag">综合监控</span><h2>显示内容</h2><table><tr><th>区域</th><th>指标</th></tr><tr><td>系统</td><td>CPU 使用率、温度和趋势；内存使用率及容量；GPU 使用率。</td></tr><tr><td>网络</td><td>上传/下载速率、趋势及 Ping 延迟。</td></tr><tr><td>磁盘</td><td>名称、容量占用、健康等级、温度、读写速率及趋势。</td></tr><tr><td>页脚</td><td>系统时间、运行时间及主机信息。</td></tr></table><h2>磁盘健康说明</h2><p>H0–H5 表示综合健康等级：H0 未发现告警，H1–H2 建议关注，H3–H4 风险升高，H5 为最高告警。磁盘容量百分比只表示空间使用情况。</p><p class="tip">健康告警出现时先保证数据备份，再结合 S.M.A.R.T. 详情确认具体属性和故障原因。</p></body></html>
